<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mikroprocesory — Test</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap');

  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --surface2: #18181f;
    --surface3: #1f1f2a;
    --border: #2a2a38;
    --accent: #7c6aff;
    --accent2: #ff6a6a;
    --accent3: #6aff9e;
    --accent4: #ffb86a;
    --accent5: #6ad4ff;
    --text: #e8e8f0;
    --muted: #6b6b80;
    --mono: 'IBM Plex Mono', monospace;
    --sans: 'IBM Plex Sans', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: var(--sans); min-height: 100vh; line-height: 1.6;
  }
  header {
    padding: 1.2rem 1.5rem .8rem; border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 100;
    background: rgba(10,10,15,.95); backdrop-filter: blur(12px);
  }
  .header-top {
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 1rem;
  }
  h1 {
    font-size: 1.35rem; font-weight: 800; letter-spacing: -.02em;
  }
  h1 span { color: var(--accent); }
  .stats {
    display: flex; gap: .6rem; font-family: var(--mono); font-size: .82rem;
  }
  .stat {
    background: var(--surface2); padding: .35rem .7rem; border-radius: 6px;
  }
  .stat.correct { color: var(--accent3); }
  .stat.wrong { color: var(--accent2); }
  .stat.remaining { color: var(--muted); }

  .progress-bar {
    width: 100%; height: 4px; background: var(--border);
    border-radius: 99px; overflow: hidden; margin-top: .8rem;
  }
  .progress-fill {
    height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent3));
    transition: width .4s ease;
  }

  main { padding: 1.5rem 1.2rem; max-width: 800px; margin: 0 auto; }

  .question-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 1.4rem 1.3rem;
    margin-bottom: 1.2rem;
    animation: slideIn .25s ease;
  }
  @keyframes slideIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }

  .q-tags {
    display: flex; gap: .4rem; margin-bottom: .8rem;
    flex-wrap: wrap;
  }
  .q-num, .q-type, .q-topic {
    font-family: var(--mono); font-size: .68rem; font-weight: 700;
    padding: .2rem .55rem; border-radius: 5px;
  }
  .q-num { color: var(--accent); background: rgba(124,106,255,.15); }
  .q-type { color: var(--accent4); background: rgba(255,184,106,.12); }
  .q-topic { color: var(--accent5); background: rgba(106,212,255,.12); }

  .q-text {
    font-size: 1.02rem; font-weight: 600; color: var(--text);
    margin-bottom: 1rem; line-height: 1.5;
  }

  .options {
    display: flex; flex-direction: column; gap: .5rem;
  }
  .option {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: .75rem 1rem;
    cursor: pointer;
    font-size: .92rem;
    color: #b8b8cc;
    transition: all .15s;
    display: flex; align-items: flex-start; gap: .7rem;
  }
  .option:hover:not(.disabled) {
    border-color: var(--accent); background: var(--surface3); color: var(--text);
  }
  .option-letter {
    font-family: var(--mono); font-weight: 700; font-size: .82rem;
    color: var(--accent); flex-shrink: 0; width: 1.1rem;
  }
  .option.correct {
    border-color: var(--accent3); background: rgba(106,255,158,.08);
    color: var(--accent3);
  }
  .option.correct .option-letter { color: var(--accent3); }
  .option.wrong {
    border-color: var(--accent2); background: rgba(255,106,106,.08);
    color: var(--accent2);
  }
  .option.wrong .option-letter { color: var(--accent2); }
  .option.disabled { cursor: default; }

  .open-answer {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: .75rem 1rem;
    color: var(--text);
    font-family: var(--sans);
    font-size: .92rem;
    resize: vertical; min-height: 100px;
  }
  .open-answer:focus { outline: none; border-color: var(--accent); }
  .open-answer.disabled { pointer-events: none; opacity: .8; }

  .reveal-btn {
    margin-top: .7rem;
    background: var(--accent);
    color: white;
    border: none;
    padding: .55rem 1.1rem;
    border-radius: 8px;
    font-family: var(--mono); font-size: .8rem; font-weight: 600;
    cursor: pointer;
    transition: opacity .2s;
  }
  .reveal-btn:hover { opacity: .85; }
  .reveal-btn:disabled { opacity: .4; cursor: default; }

  .self-grade {
    display: flex; gap: .5rem; margin-top: .7rem;
  }
  .self-grade button {
    flex: 1; padding: .55rem 1rem; border: none; border-radius: 8px;
    font-family: var(--mono); font-size: .8rem; font-weight: 600;
    cursor: pointer; transition: opacity .2s;
  }
  .self-grade .btn-good { background: var(--accent3); color: var(--bg); }
  .self-grade .btn-bad { background: var(--accent2); color: white; }
  .self-grade button:hover { opacity: .85; }

  .explanation {
    margin-top: .9rem;
    background: var(--surface2);
    border-left: 3px solid var(--accent4);
    border-radius: 0 8px 8px 0;
    padding: .8rem .95rem;
    font-size: .85rem;
    color: #b8b8cc;
    line-height: 1.55;
  }
  .explanation strong { color: var(--accent4); }
  .explanation pre {
    white-space: pre-wrap; font-family: inherit;
    margin-top: .4rem; color: var(--text);
  }
  .explanation code {
    font-family: var(--mono); background: var(--surface3);
    color: var(--accent3); padding: .1em .35em; border-radius: 4px; font-size: .9em;
  }

  .start-screen, .end-screen { text-align: center; padding: 2.5rem 1rem; }
  .start-screen h2, .end-screen h2 {
    font-size: 1.7rem; font-weight: 800; margin-bottom: 1rem;
    letter-spacing: -.02em;
  }
  .start-screen h2 span, .end-screen h2 span { color: var(--accent); }
  .start-screen p, .end-screen p {
    color: var(--muted); margin-bottom: 1.4rem; max-width: 500px; margin-left: auto; margin-right: auto;
  }

  .topic-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: .7rem; max-width: 600px; margin: 1.5rem auto;
  }
  .topic-pill {
    background: var(--surface); border: 1px solid var(--border);
    padding: .75rem .9rem; border-radius: 10px; cursor: pointer;
    text-align: left; font-family: var(--mono); font-size: .8rem;
    transition: all .15s;
  }
  .topic-pill:hover { border-color: var(--accent); background: var(--surface2); }
  .topic-pill.active {
    border-color: var(--accent); background: rgba(124,106,255,.1);
    color: var(--accent);
  }
  .topic-pill .count {
    color: var(--muted); font-size: .72rem;
  }
  .topic-pill.active .count { color: var(--accent); }

  .big-btn {
    background: var(--accent); color: white; border: none;
    padding: .85rem 1.8rem; border-radius: 10px;
    font-family: var(--mono); font-size: .9rem; font-weight: 700;
    cursor: pointer; letter-spacing: .04em;
  }
  .big-btn:hover { opacity: .9; }
  .big-btn.secondary {
    background: transparent; border: 1px solid var(--border); color: var(--text);
  }
  .start-buttons { display: flex; gap: .6rem; justify-content: center; flex-wrap: wrap; }

  .score-circle {
    width: 130px; height: 130px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--mono); font-size: 1.7rem; font-weight: 700;
    margin: 0 auto 1.2rem;
    border: 4px solid var(--accent);
    background: var(--surface);
  }
  .score-circle.green { border-color: var(--accent3); color: var(--accent3); }
  .score-circle.yellow { border-color: var(--accent4); color: var(--accent4); }
  .score-circle.red { border-color: var(--accent2); color: var(--accent2); }

  .review-list {
    text-align: left; margin-top: 2rem;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 1.2rem;
  }
  .review-list h3 {
    font-size: .85rem; font-family: var(--mono); color: var(--muted);
    margin-bottom: .6rem; letter-spacing: .08em; text-transform: uppercase;
  }
  .review-item {
    padding: .5rem 0; border-bottom: 1px solid var(--border);
    font-size: .88rem;
    display: flex; gap: .8rem; align-items: flex-start;
  }
  .review-item:last-child { border-bottom: none; }
  .review-item .num {
    font-family: var(--mono); font-weight: 700; color: var(--accent2);
    flex-shrink: 0;
  }

  code {
    font-family: var(--mono); background: var(--surface3);
    color: var(--accent3); padding: .1em .35em; border-radius: 4px; font-size: .88em;
  }

  .topic-filter {
    margin: 1.2rem auto 0; max-width: 700px;
    text-align: center;
  }
  .topic-filter h3 {
    font-family: var(--mono); font-size: .82rem; color: var(--muted);
    text-transform: uppercase; letter-spacing: .08em; margin-bottom: .8rem;
  }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <h1>Mikro<span>procesory</span> · Test</h1>
    <div class="stats">
      <div class="stat correct">✓ <span id="statCorrect">0</span></div>
      <div class="stat wrong">✗ <span id="statWrong">0</span></div>
      <div class="stat remaining"><span id="statTotal">0</span>/<span id="statAll">0</span></div>
    </div>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
</header>

<main id="root"></main>

<script>
const TOPICS = {
  'tools': '🔧 Narzędzia (ICE, JTAG, Loader)',
  'sygnatur': '📊 Analiza sygnatur',
  'cisc': '⚖️ CISC vs RISC',
  '8051': '🎯 8051 (rodzina + warianty)',
  'avr': '🦅 AVR ATmega',
  'progr': '💻 Programowanie 8051',
  'arm': '🦾 ARM',
};

const QUESTIONS = [
  // ───────── NARZĘDZIA ─────────
  {
    topic: 'tools',
    type: 'open',
    q: 'Wymień 6 kroków procesu przechwytywania danych z magistrali przez emulator wewnątrz-układowy (ICE).',
    answer: '1) Podłączenie — fizyczne podpięcie ICE do magistrali przez złącze i interfejs\n2) Przechwytywanie danych — monitorowanie sygnałów na liniach (data, address, control)\n3) Analiza danych — sprawdzenie poprawności, diagnoza błędów, monitorowanie transferów\n4) Modyfikowanie danych — wstrzykiwanie zmian na danych, adresach lub sygnałach kontrolnych\n5) Sterowanie przerwaniami — symulacja zdarzeń przez zarządzanie sygnałami przenoszeń\n6) Rejestrowanie danych — logowanie ruchu na magistrali (wartości, adresy, sygnały kontrolne)',
    expl: 'Pyt. 3 z poprzedniego kolosa. ICE = In-Circuit Emulator. Magistrala = 3 linie: data (przesyła dane), address (wskazuje miejsce), control (zarządza operacjami).'
  },
  {
    topic: 'tools',
    type: 'mc',
    q: 'Co oznacza sygnał PSEN w mikrokomputerze 8051?',
    opts: [
      'Power Save Enable — wprowadza CPU w sleep',
      'Program Store Enable — sygnał odczytu z zewnętrznej pamięci programu',
      'Peripheral Select Enable — wybór urządzenia I/O',
      'Program Save Enable — zapisuje program do flash'
    ],
    correct: 1,
    expl: 'PSEN aktywny gdy CPU pobiera instrukcję z zewnętrznej pamięci programu (ROM). Przy zdalnym ładowaniu kodu: 0x0000–0x0FFF aktywny PSEN (czyta ROM), 0x1000+ program leży w RAM (RD/WR).'
  },
  {
    topic: 'tools',
    type: 'open',
    q: 'Opisz format INTELA (Intel HEX) używany do zdalnego ładowania kodu wykonywalnego.',
    answer: 'Format wiadomości tekstowej (heksadecymalnej), każdy rekord zaczyna się dwukropkiem ":". Struktura rekordu:\n• 2 znaki — długość danych (w bajtach)\n• 4 znaki — adres ładowania (load address)\n• 2 znaki — typ rekordu\n• N znaków = 2 × długość — same dane\n• 2 znaki — suma kontrolna (checksum)\n\nOstatnia linia (EOF marker): :00000001FF\n— długość 0, adres 0000, typ 01 (EOF), brak danych, checksum FF',
    expl: 'Pyt. 4 z poprzedniego kolosa. Kod sterowany przez program zdalnego ładowania zapisany w ROM, otrzymywany przez interfejs I/O i zapisywany do RAM.'
  },
  {
    topic: 'tools',
    type: 'mc',
    q: 'Sygnał TMS w interfejsie JTAG odpowiada za:',
    opts: [
      'Test Data Input — dane wejściowe',
      'Test Mode Select — wybór trybu',
      'Test Master Synchronization',
      'Test Memory Strobe'
    ],
    correct: 1,
    expl: 'Pełen zestaw JTAG: TMS (tryb), TDI (data in), TDO (data out), TCK (zegar), RTCK (zwrotny zegar), nSRST (system reset), nTRST (test reset). EmbeddedICE używa DBGRQ/DBGACK.'
  },
  {
    topic: 'tools',
    type: 'open',
    q: 'Co to jest symulator pamięci programu i do czego służy?',
    answer: 'Symulator pamięci programu (ROM simulator) to urządzenie zastępujące fizyczną pamięć ROM w prototypie systemu mikrokomputerowego. Podłączany w miejsce pamięci programu — symuluje jej zachowanie, ale jego zawartość można zmieniać przez interfejs (zwykle z PC).\n\nZalety:\n- Szybkie przeładowanie programu bez konieczności wymiany ROM\n- Eliminuje cykl programowania pamięci EPROM/FLASH\n- Skraca czas debugowania (sekundy zamiast minut/godzin)\n- Daje dostęp do podglądu wykonywanego kodu',
    expl: 'Symulator ROM był jedną z głównych metod przed pojawieniem się MCU z FLASH/JTAG, gdzie program można było ładować bez wyjmowania układu.'
  },

  // ───────── ANALIZA SYGNATUR ─────────
  {
    topic: 'sygnatur',
    type: 'open',
    q: 'Co to jest analiza sygnatur i jaki wielomian charakterystyczny jest standardowo używany?',
    answer: 'Analiza sygnatur to metoda kompresji długich strumieni danych do krótkich "podpisów" (signatures) służąca do wykrywania błędów w testowaniu układów cyfrowych. Strumień danych t(x) jest podawany na rejestr przesuwny z liniowym sprzężeniem zwrotnym (LFSR). Po m taktach zegarowych zawartość rejestru = signature S(x).\n\nStandardowy wielomian charakterystyczny (16-bit):\nG(x) = x¹⁶ + x¹² + x⁹ + x⁷ + 1\n\nSignature = reszta z dzielenia: S(x) = rem(t(x) / G(x))\n\nDla porównania z wzorcem: jeśli signatures są identyczne, dane są poprawne (z prawdopodobieństwem 99.998%).',
    expl: 'Wielomian dualny Ψ(x) = x¹⁶ + x⁹ + x⁷ + x⁴ + 1. To pytanie nie pojawiło się na poprzednim kolosie ale jest częścią programu (sekcja 1.5).'
  },
  {
    topic: 'sygnatur',
    type: 'mc',
    q: 'Jakie jest prawdopodobieństwo wykrycia błędu w analizie sygnatur dla rejestru 16-bit i bardzo długiego strumienia (m → ∞)?',
    opts: [
      '50% — równe szanse wykrycia',
      '~99.998% (1 - 1/2¹⁶)',
      '100% — zawsze wykrywa',
      '~75% — średnia jakość'
    ],
    correct: 1,
    expl: 'Dla n=16 i m→∞: Pe = 1/2¹⁶ ≈ 0,000015 (15 błędów na milion). P = 1 - Pe ≈ 99,998%. Dla m ≤ n (krótkie strumienie): wszystkie błędy wykrywane (Pe = 0).'
  },
  {
    topic: 'sygnatur',
    type: 'mc',
    q: 'W porównaniu z transition counting, analiza sygnatur:',
    opts: [
      'Ma gorszą detekcję błędów dla długich strumieni',
      'Gubi (m-1)/2^m błędów dla długich strumieni',
      'Zawsze wykrywa pojedyncze błędy bitowe',
      'Wymaga większej pamięci niż transition counting'
    ],
    correct: 2,
    expl: 'Signature analysis ZAWSZE wykrywa pojedyncze błędy bitowe. Transition counting gubi (m-1)/2^m błędów (dla dużych m to ~50%). To kluczowa przewaga analizy sygnatur.'
  },
  {
    topic: 'sygnatur',
    type: 'open',
    q: 'Jakie znaki są używane do wyświetlania 16-bitowego signature i dlaczego nie standardowe heksadecymalne?',
    answer: 'Signature 16-bit wyświetla się jako 4 znaki, ale alfabet różni się od standardowego heksadecymalnego:\n• 0–9 — bez zmian\n• A, C, F, H, P, U — zamiast standardowych A, B, C, D, E, F\n\nPowód: lepsza czytelność na 7-segmentowym wyświetlaczu LED. Litery B, D, E mogą być mylone z cyframi (8, 0, 6), więc zastąpiono je literami które są jednoznaczne wizualnie.',
    expl: 'Mapowanie: 1010=A, 1011=C, 1100=F, 1101=H, 1110=P, 1111=U. Tak by każdy znak był wyraźnie odróżnialny od cyfr na wyświetlaczu kalkulatorowym.'
  },

  // ───────── CISC vs RISC ─────────
  {
    topic: 'cisc',
    type: 'open',
    q: 'Porównaj architektury CISC i RISC w 5 wymiarach: dostęp ALU, liczba rejestrów, liczba instrukcji, sposób wykonania, pobór mocy.',
    answer: 'CISC:\n• ALU operuje na pamięci LUB rejestrach (z zapisem zwrotnym)\n• Mało rejestrów\n• Dużo instrukcji (złożone, różne tryby adresowania)\n• Wykonanie szeregowe\n• Większy pobór mocy (złożona logika)\n\nRISC:\n• ALU operuje TYLKO na rejestrach (komunikacja z pamięcią przez load/store)\n• Dużo rejestrów\n• Mało instrukcji (proste, każda 1 cykl)\n• Wykonanie potokowe (pipeline)\n• Mniejszy pobór mocy\n\nDodatkowy punkt: nowoczesne x86 (CISC) wewnętrznie tłumaczą instrukcje na RISC micro-ops, by zyskać efektywność RISC — kosztem dodatkowej logiki, która podnosi pobór mocy.',
    expl: 'Pyt. 5 z poprzedniego kolosa. Można narysować schemat blokowy: CISC ma ALU połączone i z pamięcią, i z rejestrami; RISC ma ALU połączone tylko z rejestrami a pamięć przez LDR/STR.'
  },
  {
    topic: 'cisc',
    type: 'mc',
    q: 'Wzór na czas wykonania programu to:',
    opts: [
      't/prog = (cykle/instr) ÷ (instr/prog)',
      't/prog = (t/cykl) × (cykle/instr) × (instr/prog)',
      't/prog = (t/cykl) + (instr/prog)',
      't/prog = (instr/prog)² × (t/cykl)'
    ],
    correct: 1,
    expl: 'Klasyczny wzór: czas/program = czas cyklu zegara × cykle/instrukcja × instrukcje/program. RISC zmniejsza środkowy czynnik, CISC zmniejsza prawy.'
  },
  {
    topic: 'cisc',
    type: 'mc',
    q: 'O ile mniej mocy zużywa procesor ARM/MIPS w porównaniu z x86 (na 1 MHz)?',
    opts: ['10–20%', '40–50%', '70–80%', 'Tyle samo, x86 jest tylko szybszy'],
    correct: 1,
    expl: 'ARM/MIPS zużywają 40–50% mniej mocy/MHz i mają 3–4× mniejszą powierzchnię krzemu niż x86. x86 ma ~4–8% wyższą wydajność/MHz, ale wyższy pobór wynika z wewnętrznego przekodowania CISC→RISC micro-ops.'
  },

  // ───────── 8051 ─────────
  {
    topic: '8051',
    type: 'mc',
    q: 'Architektura 8051 to:',
    opts: [
      'Von Neumann z wspólną przestrzenią pamięci',
      'Harvard z oddzielnymi przestrzeniami pamięci programu i danych',
      'Modyfikowany Harvard z cache L1',
      'RISC z 32 rejestrami'
    ],
    correct: 1,
    expl: '8051 = klasyczny Harvard, oddzielne przestrzenie 64 KB programu i 64 KB zewnętrznej pamięci danych. To CISC (a nie RISC), ma 4 zestawy po 8 rejestrów R0–R7.'
  },
  {
    topic: '8051',

// State
let current = 0;
let correct = 0;
let wrong = 0;
let userAnswers = [];
let activeQuestions = QUESTIONS;
let activeTopic = null;

const root = document.getElementById('root');

function updateStats() {
  document.getElementById('statCorrect').textContent = correct;
  document.getElementById('statWrong').textContent = wrong;
  document.getElementById('statTotal').textContent = current;
  document.getElementById('statAll').textContent = activeQuestions.length;
  const pct = activeQuestions.length > 0 ? (current / activeQuestions.length) * 100 : 0;
  document.getElementById('progress').style.width = pct + '%';
}

function startScreen() {
  // Count questions per topic
  const counts = {};
  for (const t in TOPICS) counts[t] = QUESTIONS.filter(q => q.topic === t).length;

  root.innerHTML = `
    <div class="start-screen">
      <h2>Powtórka <span>kolosa</span></h2>
      <p>${QUESTIONS.length} pytań pokrywających cały syllabus. Mix ABCD i otwartych. Możesz przerobić wszystkie albo wybrać jeden temat.</p>

      <div class="topic-filter">
        <h3>Wybierz zakres</h3>
        <div class="topic-grid">
          <div class="topic-pill ${activeTopic === null ? 'active' : ''}" onclick="setTopic(null)">
            🎲 Wszystkie <span class="count">(${QUESTIONS.length})</span>
          </div>
          ${Object.entries(TOPICS).map(([k, v]) => `
            <div class="topic-pill ${activeTopic === k ? 'active' : ''}" onclick="setTopic('${k}')">
              ${v} <span class="count">(${counts[k]})</span>
            </div>
          `).join('')}
        </div>
      </div>

      <div class="start-buttons" style="margin-top:2rem">
        <button class="big-btn" onclick="start()">▶ Zaczynamy</button>
      </div>
    </div>
  `;
  updateStats();
}

function setTopic(topic) {
  activeTopic = topic;
  startScreen();
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function start() {
  current = 0; correct = 0; wrong = 0; userAnswers = [];
  const filtered = activeTopic === null
    ? QUESTIONS
    : QUESTIONS.filter(q => q.topic === activeTopic);
  activeQuestions = shuffle(filtered);
  showQuestion();
}

function showQuestion() {
  if (current >= activeQuestions.length) return endScreen();
  const q = activeQuestions[current];
  updateStats();

  const tags = `
    <div class="q-tags">
      <span class="q-num">${current+1}/${activeQuestions.length}</span>
      <span class="q-type">${q.type === 'mc' ? 'ABCD' : 'Otwarte'}</span>
      <span class="q-topic">${TOPICS[q.topic]}</span>
    </div>
  `;

  if (q.type === 'mc') {
    root.innerHTML = `
      <div class="question-card">
        ${tags}
        <div class="q-text">${q.q}</div>
        <div class="options" id="options">
          ${q.opts.map((o, i) => `
            <div class="option" onclick="answerMC(${i})">
              <span class="option-letter">${String.fromCharCode(65+i)}</span>
              <span>${o}</span>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  } else {
    root.innerHTML = `
      <div class="question-card">
        ${tags}
        <div class="q-text">${q.q}</div>
        <textarea class="open-answer" id="openInput" placeholder="Twoja odpowiedź..."></textarea>
        <button class="reveal-btn" onclick="revealOpen()">Pokaż odpowiedź wzorcową</button>
        <div id="openReveal"></div>
      </div>
    `;
  }
}

function answerMC(idx) {
  const q = activeQuestions[current];
  const opts = document.querySelectorAll('.option');
  opts.forEach(o => o.classList.add('disabled'));

  if (idx === q.correct) {
    opts[idx].classList.add('correct');
    correct++;
    userAnswers.push({ q: current, ok: true });
  } else {
    opts[idx].classList.add('wrong');
    opts[q.correct].classList.add('correct');
    wrong++;
    userAnswers.push({ q: current, ok: false });
  }

  const card = document.querySelector('.question-card');
  card.insertAdjacentHTML('beforeend', `
    <div class="explanation"><strong>Wyjaśnienie:</strong> ${q.expl}</div>
    <button class="reveal-btn" style="margin-top:.9rem" onclick="next()">Następne →</button>
  `);
  updateStats();
}

function revealOpen() {
  const q = activeQuestions[current];
  const input = document.getElementById('openInput');
  input.classList.add('disabled');
  document.querySelector('.reveal-btn').disabled = true;

  document.getElementById('openReveal').innerHTML = `
    <div class="explanation" style="margin-top:.9rem">
      <strong>Odpowiedź wzorcowa:</strong>
      <pre>${q.answer}</pre>
    </div>
    <div class="explanation" style="border-left-color:var(--accent3)">
      <strong style="color:var(--accent3)">Wskazówka:</strong> ${q.expl}
    </div>
    <p style="margin-top:.9rem;color:var(--muted);font-size:.82rem">Oceń sam — czy umiałeś?</p>
    <div class="self-grade">
      <button class="btn-bad" onclick="gradeOpen(false)">✗ Nie umiałem</button>
      <button class="btn-good" onclick="gradeOpen(true)">✓ Umiałem</button>
    </div>
  `;
}

function gradeOpen(ok) {
  if (ok) correct++; else wrong++;
  userAnswers.push({ q: current, ok });
  setTimeout(next, 200);
}

function next() {
  current++;
  showQuestion();
}

function endScreen() {
  const total = activeQuestions.length;
  const pct = total > 0 ? Math.round((correct / total) * 100) : 0;
  let cls = 'red', msg = 'Trzeba popowtarzać 📚';
  if (pct >= 80) { cls = 'green'; msg = 'Świetnie! 💪 Gotowy na kolos.'; }
  else if (pct >= 60) { cls = 'yellow'; msg = 'Nieźle! Sprawdź te niżej z czerwonym.'; }

  const wrongQs = userAnswers.filter(a => !a.ok).map(a => a.q);

  root.innerHTML = `
    <div class="end-screen">
      <h2>Wynik <span>${correct}/${total}</span></h2>
      <div class="score-circle ${cls}">${pct}%</div>
      <p>${msg}</p>
      <div class="start-buttons">
        <button class="big-btn" onclick="start()">↻ Jeszcze raz</button>
        <button class="big-btn secondary" onclick="startScreen()">📚 Inny temat</button>
      </div>
      ${wrongQs.length > 0 ? `
      <div class="review-list">
        <h3>Do powtórki (${wrongQs.length})</h3>
        ${wrongQs.map(i => `
          <div class="review-item">
            <span class="num">${i+1}.</span>
            <div>
              <div style="color:var(--text)">${activeQuestions[i].q}</div>
              <div style="color:var(--muted);font-size:.8rem;margin-top:.2rem">
                ${TOPICS[activeQuestions[i].topic]}
              </div>
            </div>
          </div>
        `).join('')}
      </div>` : ''}
    </div>
  `;
  updateStats();
}

startScreen();
</script>

</body>
</html>
